spring.application.name=campus-sensor-monitor
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/campus_sensors}
spring.datasource.username=${DB_USERNAME:campus}
spring.datasource.password=${DB_PASSWORD:campus123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# For local development only. Do not expose these credentials in production.
management.endpoints.web.exposure.include=health,info
